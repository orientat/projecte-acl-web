name: Publica la interfície ACL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descarrega el codi
        uses: actions/checkout@v4
      - name: Prepara GitHub Pages
        uses: actions/configure-pages@v5
      - name: Copia només la interfície pública
        run: |
          mkdir public
          cp index.html app.js styles.css public/
      - name: Puja els fitxers del web
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publica el web
        id: deployment
        uses: actions/deploy-pages@v4
